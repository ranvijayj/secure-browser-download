<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body class="popup">
  <h2><img src="icons/32.png" alt="" class="logo"> SecureDL</h2>
  <p class="hint">Right-click any link → <b>Download with password</b>.</p>
  <label for="mode"><b>When a download starts</b></label>
  <select id="mode">
    <option value="off">Do nothing (right-click only)</option>
    <option value="ask-docs">Ask me for documents &amp; images</option>
    <option value="ask-all">Ask me for every download</option>
  </select>
  <p id="state" class="hint"></p>
  <div id="needAccess" class="warn" hidden>
    ⚠ Automatic detection is on, but Chrome hasn't given SecureDL access to fetch downloads yet, so nothing is intercepted.
    <button id="grant">Give access…</button>
  </div>
  <details id="recentWrap">
    <summary class="hint">Recent downloads</summary>
    <ul id="recent" class="log"></ul>
  </details>
  <hr>
  <p><b>Lock a file already on disk</b></p>
  <input type="file" id="file">
  <label for="pw">Password</label>
  <input type="password" id="pw" autocomplete="new-password">
  <label for="pw2">Confirm password</label>
  <input type="password" id="pw2" autocomplete="new-password">
  <p id="pwWarn" class="warn" hidden></p>
  <button id="go">Encrypt &amp; save</button>
  <p id="status" role="status"></p>
  <p class="hint"><a href="options.html" target="_blank">Settings</a></p>
<script src="lib/pdf-lib.min.js"></script>
<script src="crypto.js"></script>
<script src="settings.js"></script>
<script src="popup.js"></script>
</body></html>
