<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body class="popup">
  <header>
    <div class="brand"><img src="icons/32.png" alt="">SecureDL</div>
    <a href="options.html" target="_blank" title="Settings" aria-label="Settings"><svg class="icon"><use href="icons.svg#settings"/></svg></a>
  </header>

  <section>
    <h3 id="modeLabel">When a download starts</h3>
    <div class="choices" role="radiogroup" aria-labelledby="modeLabel">
      <label class="choice"><input type="radio" name="mode" value="off"><b>Do nothing</b><span>Lock files only when you right-click a link.</span></label>
      <label class="choice"><input type="radio" name="mode" value="ask-docs"><b>Ask for documents</b><span>PDFs, Office files, spreadsheets, images.</span></label>
      <label class="choice"><input type="radio" name="mode" value="ask-all"><b>Ask for every download</b><span>Including installers and archives.</span></label>
    </div>
    <div id="needAccess" class="callout warn" hidden><svg class="icon"><use href="icons.svg#alert"/></svg>
      <div><b>Not working yet</b><p>Chrome needs to give SecureDL access before downloads can be stopped.</p>
      <button id="grant" class="btn secondary">Give access</button></div></div>
  </section>

  <section id="recentWrap">
    <h3>Recent downloads</h3>
    <ul id="recent" class="activity"></ul>
  </section>

  <section>
    <button id="lockLocal" class="btn secondary"><svg class="icon"><use href="icons.svg#lock"/></svg>Lock a file on this computer</button>
  </section>
<script src="settings.js"></script>
<script src="popup.js"></script>
</body></html>
